# Docker Environment Configuration
spring.application.name=ProblemService

# MySQL Database Configuration (for Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Force UTF-8 encoding on connection initialization
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# JPA Configuration for Docker (use existing schema)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# Server Configuration
server.port=8080

# Logging Configuration
logging.level.com.problemservice=INFO
logging.level.com.problemservice.ProblemService.config.LoggingFilter=INFO
logging.level.com.problemservice.ProblemService.config.LoggingInterceptor=INFO
logging.level.com.problemservice.ProblemService.service.QuestionIdCacheScheduler=DEBUG
logging.level.com.problemservice.ProblemService.consumer=DEBUG
logging.level.org.springframework.kafka=DEBUG

# API Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY:}
openai.api.timeout=${OPENAI_API_TIMEOUT:60}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=problem-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Topics
app.kafka.topic.session-completed=learning-session-completed
spring.kafka.topic.user-profile=user-profile-events