# 테스트 전용 MySQL (도커 3307) - 분리된 스키마 사용
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/problem_service_test_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&createDatabaseIfNotExist=true
spring.datasource.username=problem_user
spring.datasource.password=problem_password

# 테스트 시 스키마 자동 생성/삭제
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Kafka 비활성 (포트 0)
spring.kafka.bootstrap-servers=localhost:0
spring.kafka.listener.auto-startup=false

# Redis (도커 redis: 6379) - 캐시 동작 검증
spring.cache.type=redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=1
spring.cache.redis.key-prefix=

server.port=0
logging.level.root=INFO

# Dummy JWT secret for test environment
jwt.secret-key=test-secret-key-for-problem-service-integration-tests
